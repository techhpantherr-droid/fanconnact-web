name: Generate SEO match pages

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate match & tournament pages
        env:
          BACKEND_URL: https://web-production-589a7.up.railway.app
        run: node scripts/generate-seo-pages.mjs

      - name: Commit changes
        run: |
          git config user.name "fanconnact-bot"
          git config user.email "actions@users.noreply.github.com"
          git add matches tournament sitemap-matches.xml
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "chore(seo): refresh match & tournament pages [skip ci]"
            git push
          fi
