    body { font-family: "Hanken Grotesk", sans-serif; }
    .dark body { background-color: #0B0E11; color: #fff; }
    .light body { background-color: #F8F9FF; color: #0f172a; }

    .frame-emerald { border: 3px solid #3F69A8 !important; box-shadow: 0 0 10px rgba(63,105,168,0.5); }
    .frame-diamond { border: 3px solid #22d3ee !important; box-shadow: 0 0 10px rgba(34,211,238,0.5); }
    .profile-card { background: #060d18; border: 1px solid #12263f; }
    .dark .profile-card { background: #060d18; border-color: #12263f; }
    body:not(.dark) .profile-card { background: #fff; border-color: #e5e7eb; }
    .follower-row { border-bottom: 1px solid #0f1d30; }

<body class="min-h-screen w-full bg-[#F8F9FF] dark:bg-[#0B0E11]">
  <main class="max-w-2xl mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-4">
      <button onclick="history.back()" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <h1 class="text-xl font-bold font-headline">Fan Profile</h1>
    </div>

    <!-- Profile Card -->
    <div id="profileCard" class="profile-card rounded-2xl p-6 mb-4">
      <div class="flex items-center gap-4">
        <img id="pAvatar" src="assets/images/default-avatar.png?w=150" class="w-20 h-20 rounded-full border-2 border-emerald-accent object-cover" />
        <div class="flex-1 min-w-0">
          <h2 id="pName" class="text-lg font-bold truncate">—</h2>
          <p id="pUsername" class="text-sm text-slate-500 dark:text-slate-400 truncate">@fan</p>
          <div class="mt-1 flex items-center gap-2">
            <span id="pLevel" class="bg-purple-100 text-purple-700 dark:bg-[#23153e] dark:text-purple-300 px-2 py-0.5 rounded text-xs">Level 1</span>
            <span id="pXP" class="text-xs text-slate-500 dark:text-slate-400">0 XP</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-4">
      <div class="profile-card rounded-xl p-4 text-center">
        <div id="pGlobalRank" class="text-2xl font-bold">—</div>
        <div class="text-xs text-slate-500 dark:text-slate-400">Global Rank</div>
        <div id="pGlobalRankOf" class="text-[10px] text-slate-400 dark:text-slate-500"></div>
      </div>
      <button onclick="showTab('followers')" class="profile-card rounded-xl p-4 text-center cursor-pointer hover:opacity-80 transition">
        <div id="pFollowers" class="text-2xl font-bold">0</div>
        <div class="text-xs text-slate-500 dark:text-slate-400">Followers</div>
      </button>
      <button onclick="showTab('following')" class="profile-card rounded-xl p-4 text-center cursor-pointer hover:opacity-80 transition">
        <div id="pFollowing" class="text-2xl font-bold">0</div>
        <div class="text-xs text-slate-500 dark:text-slate-400">Following</div>
      </button>
    </div>

    <!-- Coins / Level progress -->
    <div class="profile-card rounded-2xl p-4 mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm text-slate-500 dark:text-slate-400">FanCoins</span>
        <span id="pCoins" class="text-sm font-bold text-amber-600 dark:text-yellow-400">0 🪙</span>
      </div>
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs text-slate-500 dark:text-slate-400">Level Progress</span>
        <span id="pNextLevel" class="text-xs text-slate-500 dark:text-slate-400">—</span>
      </div>
      <div class="w-full bg-slate-200 dark:bg-black/30 rounded-full h-2 overflow-hidden">
        <div id="pLevelBar" class="bg-emerald-500 h-2 rounded-full" style="width:0%"></div>
      </div>
    </div>
    <!-- Identity details -->
    <div id="pDetails" class="grid grid-cols-2 gap-2 mb-4"></div>

    <!-- Followers / Following list -->
    <div id="followListCard" class="profile-card rounded-2xl p-4 hidden">
      <div class="flex items-center justify-between mb-3">
        <h3 id="followListTitle" class="font-semibold">Followers</h3>
        <button onclick="hideTab()" class="text-slate-500 dark:text-slate-400 text-sm">Close</button>
      </div>
      <div id="followList" class="space-y-1"></div>
    </div>

    <div id="loadingState" class="text-center text-slate-500 dark:text-slate-400 py-10">Loading profile…</div>
  </main>

  <script src="js/level-system.js"></script>
  <script type="module" src="js/user-profile.js?v=916012"></script>
</body>
</html>
